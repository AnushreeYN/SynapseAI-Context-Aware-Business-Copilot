name: CI/CD

on:
  push:
    branches:
      - main
      - synapse-dev
  pull_request:
    branches:
      - main
      - synapse-dev

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_synapseai.db
      SECRET_KEY: ci-only-secret-key
      BACKEND_CORS_ORIGINS: http://localhost:5174

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall app

      - name: Run backend tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend env file
        run: cp backend/.env.example backend/.env

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Docker services
        run: docker compose build

  deployment-ready:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker
    if: github.event_name == 'push'

    steps:
      - name: Mark deployment-ready artifact
        run: |
          echo "SynapseAI build is deployment-ready for branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
